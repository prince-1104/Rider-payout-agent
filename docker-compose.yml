services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quickdrop
      POSTGRES_PASSWORD: quickdrop
      POSTGRES_DB: quickdrop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdrop -d quickdrop"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://quickdrop:quickdrop@db:5432/quickdrop
      PAYSWIFT_BASE_URL: http://payswift:8081
    depends_on:
      db:
        condition: service_healthy
      payswift:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
